<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ITC Analytics Login</title>
  <style>
    :root{--bg1:#061827;--bg2:#0A2B3D;--bg3:#123E55;--cyan:#6EEBFF;--teal:#2BC7D3;--text:#F5FAFF;--muted:#8FA9BD;--line:rgba(120,220,235,.25);--glow:rgba(80,220,255,.35)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,var(--bg1),var(--bg2) 52%,var(--bg3));font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
    .card{width:min(420px,calc(100vw - 32px));padding:28px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.08);box-shadow:0 24px 70px rgba(0,0,0,.35),0 0 44px var(--glow);backdrop-filter:blur(18px)}
    .logo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--teal));color:#061827;font-weight:900;margin-bottom:14px;box-shadow:0 0 26px var(--glow)}
    h1{margin:0;font-size:24px}
    p{margin:8px 0 22px;color:var(--muted);font-weight:700}
    label{display:block;margin:14px 0 7px;color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
    input{width:100%;border:1px solid rgba(110,235,255,.46);border-radius:14px;background:rgba(6,24,39,.58);color:var(--text);padding:13px 14px;font-weight:800;outline:none;box-shadow:0 0 18px rgba(80,220,255,.18),inset 0 1px 0 rgba(255,255,255,.08)}
    input:focus{border-color:rgba(110,235,255,.9);box-shadow:0 0 26px rgba(80,220,255,.38)}
    button{width:100%;margin-top:20px;border:1px solid rgba(110,235,255,.58);border-radius:14px;background:rgba(38,220,230,.18);color:var(--text);padding:13px 16px;font-weight:900;cursor:pointer;box-shadow:0 0 24px rgba(80,220,255,.25)}
    button:hover{background:rgba(38,220,230,.25)}
    .msg{min-height:20px;margin-top:14px;color:#fecaca;font-weight:800;font-size:13px}
  </style>
</head>
<body>
  <form class="card" id="loginForm">
    <div class="logo">MSR</div>
    <h1>ITC Analytics</h1>
    <p>Sign in to MSR Guest Behaviour Portal</p>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required/>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required/>
    <button type="submit">Login</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.textContent = '';
      const body = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      };
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Login failed');
        window.location.href = '/index.html';
      } catch (err) {
        msg.textContent = err.message || 'Login failed';
      }
    });
  </script>
</body>
</html>
